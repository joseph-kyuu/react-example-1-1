<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- BS5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BS5 Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- React 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>

    <!-- ReactDOM 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="App"></div>
  </body>
  <script type="text/babel">
    // 資料
    // 資料來源：https://data.gov.tw/dataset/6069
    // 天氣圖示：https://www.cwb.gov.tw/V8/C/K/Weather_Icon.html
    // 因為氣象圖示相當多，所以本範例中僅採用已下載天氣資料為主，其餘圖示同學可至上方氣象局網站下載
    (async () => {
      const data = await axios.get("./F-C0032-001.json");
      const { location } = data.data.cwbopendata.dataset;
      const options = { hour: "numeric", minute: "numeric" };
      console.log(location);

      // 根元件
      // props、children、三元運算子
      const App = function () {
        return (
          <>
            <div className="container py-5">
              <div className="row row-cols-2">
                {location.map(function (item) {
                  return (
                    <div className="col" key={item.locationName}>
                      <Card
                        item={item}
                        locationName={item.locationName}
                        timeArr={item.weatherElement[0].time}
                      />
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      };

      // 時間元件

      // 卡片元件
      const Card = function ({ item, locationName, timeArr }) {
        return (
          <>
            <div className="card mb-4 text-center">
              <div className="border-bottom p-3 bg-warning">
                <h5 className="card-title mb-0">{locationName}</h5>
              </div>
              <div className="row row-cols-3">
                {timeArr.map(function (time, index) {
                  return (
                    <div className="col" key={index}>
                      <Weather
                        key={index}
                        pop={
                          item.weatherElement[4].time[index].parameter
                            .parameterName
                        }
                        imgUrl={time.parameter.parameterName}
                        weatherState={time.parameter.parameterName}
                      />
                    </div>
                  );
                })}
              </div>
            </div>
          </>
        );
      };

      // 天氣元件
      const Weather = function ({ pop, imgUrl, weatherState }) {
        return (
          <>
            <div className="card-body">
              <h2>23日</h2>
              <p>
                下午 13:00
                <br />
                ~<br />
                下午 13:00
              </p>
              <div className="mb-2">
                <img src={`./weatherIcon/${imgUrl}.svg`} alt="" />
              </div>
              <p>{weatherState}</p>
              <p>
                <i className="bi bi-umbrella-fill"></i>
                {pop}%
              </p>
            </div>
          </>
        );
      };

      const rootEl = document.querySelector("#App");
      const root = ReactDOM.createRoot(rootEl);
      root.render(<App />);
    })();
  </script>
</html>
