<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- BS5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BS5 Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- React 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>

    <!-- ReactDOM 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="App"></div>
  </body>
  <script type="text/babel">
    // 資料
    const cardsData = [
      {
        index: 1,
        title: "基本版",
        price: 1000,
        content: "基本每週配給",
        btn: "免費試用",
      },
      {
        index: 2,
        title: "進階版",
        price: 6000,
        content: "奶蛋魚肉",
        btn: "永保安康",
      },
      {
        index: 3,
        title: "企業版",
        price: "請洽客服",
        content: "多少人數均可定製",
        btn: "大吃大喝方案",
      },
    ];

    // 根元件
    // props、children、三元運算子
    const App = function () {
      return (
        <>
          <div className="container py-5">
            {cardsData.map(function (cardData) {
              return (
                <Card
                  key={cardData.index}
                  title={cardData.title}
                  price={cardData.price}
                  content={cardData.content}
                  btn={cardData.btn}
                />
              );
            })}
          </div>
        </>
      );
    };

    // 卡片元件
    const Card = function ({ title, price, content, btn }) {
      return (
        <>
          <div className="card mb-4">
            <div className="border-bottom p-3 bg-warning">
              <h5 className="card-title mb-0">{title}</h5>
            </div>
            <div className="card-body">
              <h2 className="card-text">
                {typeof price === "number" ? `${price}/月` : `${price}`}
              </h2>
              <p className="card-text">{content}</p>
              {title === "企業版" ? (
                <Button
                  btnsSyle="btn btn-outline-primary"
                  children={
                    <>
                      <i className="bi bi-star-fill"></i>
                      {btn}
                      <i className="bi bi-star-fill"></i>
                    </>
                  }
                />
              ) : (
                <Button btnsSyle="btn btn-primary" children={btn} />
              )}
            </div>
          </div>
        </>
      );
    };

    // 按鈕元件
    const Button = function ({ btnsSyle, children }) {
      return (
        <>
          <a href="#" className={btnsSyle}>
            <p className="card-text">{children}</p>
          </a>
        </>
      );
    };

    const rootEl = document.querySelector("#App");
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</html>
