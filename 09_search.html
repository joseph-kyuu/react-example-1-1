<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- BS5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- BS5 Icon -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- React 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>

    <!-- ReactDOM 18 -->
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="App"></div>
  </body>
  <script type="text/babel">
    // 卡片元件
    const Card = function ({ title, image }) {
      return (
        <>
          <h2>{title}</h2>
          <img className="w-50 " src={image} alt="商品圖片" />
        </>
      );
    };

    // 根元件
    const App = function () {
      console.log("元件渲染");

      // hook 個別取出後，儲存到變數中
      const useState = React.useState;
      const useEffect = React.useEffect;

      /*
    解構方式
    const {useState, useEffect} = React;
    */

      /*
    直接使用
    [state, setState]= React.useState(1);
    */

      /*
    Vite + ESM
    import { useState, useEffect } from "react";
    */

      // useState
      const [products, setProducts] = useState([]);
      const [keyword, setKeyword] = useState("");

      // 資料 useEffect
      useEffect(function () {
        axios.get("https://dummyjson.com/products").then(function (response) {
          setProducts(response.data.products);

          console.log("資料取得");
        });
      }, []);

      // JSX
      // 新增搜尋欄位
      // 使用者輸入文字，點擊搜尋按鈕後取得輸入欄位內容，並觸發重新渲染和網路請求。
      return (
        <>
          {console.log("執行JSX")}
          <div className="text-center my-5">
            <label htmlFor="search">搜尋：</label>
            <input
              className="me-2"
              type="text"
              id="search"
              onChange={function (e) {
                setKeyword(e.target.value);
                console.log(keyword);
              }}
            />
            <button
              type="button"
              onClick={function () {
                axios
                  .get(`https://dummyjson.com/products/category/${keyword}`)
                  .then(function (res) {
                    setProducts(res.data.products);
                  })
                  .catch(function (err) {
                    alert("沒有這個商品");
                  });
              }}
            >
              搜尋
            </button>
            <p className="text-danger">
              請嘗試輸入 : laptops、smartphones、furniture、motorcycle
            </p>
          </div>

          <h1 className="text-center">商品圖片</h1>
          <div className="row row-cols-2 text-center">
            {products.map(function (product) {
              return (
                <div className="col" key={product.id}>
                  <Card title={product.title} image={product.images[0]} />
                </div>
              );
            })}
          </div>
        </>
      );
    };

    const rootEl = document.querySelector("#App");
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>
</html>
